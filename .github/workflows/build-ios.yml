name: Build iOS App (.ipa)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Free iOS (.ipa)
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install PHP 8.3 & Composer
        timeout-minutes: 5
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install php@8.3
          brew link --overwrite --force php@8.3
          BREW_PREFIX=$(brew --prefix)
          echo "$BREW_PREFIX/opt/php@8.3/bin" >> $GITHUB_PATH
          echo "$BREW_PREFIX/opt/php@8.3/sbin" >> $GITHUB_PATH
          echo "$BREW_PREFIX/bin" >> $GITHUB_PATH
          export PATH="$BREW_PREFIX/opt/php@8.3/bin:$BREW_PREFIX/bin:$PATH"
          php -v
          
          # Install Composer
          curl -sS https://getcomposer.org/installer | php -- --install-dir="$BREW_PREFIX/bin" --filename=composer
          chmod +x "$BREW_PREFIX/bin/composer"
          composer --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Select Latest Xcode Version
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.4.app || sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version

      - name: Install Composer Dependencies
        run: |
          composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: Install NativePHP iOS Project
        run: |
          php artisan native:install ios --no-interaction

      - name: Bundle Laravel App for iOS
        run: |
          # Run native:build to copy source and configure bundle
          php artisan native:build --release --no-tty || true

      - name: Compile iOS Archive with Xcode
        run: |
          cd nativephp/ios
          
          # Install CocoaPods if Podfile is present
          if [ -f "Podfile" ]; then
            pod install || true
          fi

          # Workspace or project resolution
          BUILD_TARGET="-project NativePHP.xcodeproj"
          if [ -d "NativePHP.xcworkspace" ]; then
            BUILD_TARGET="-workspace NativePHP.xcworkspace"
          elif [ -d "NativePHP.xcodeproj/project.xcworkspace" ]; then
            BUILD_TARGET="-workspace NativePHP.xcodeproj/project.xcworkspace"
          fi

          echo "Building archive using: $BUILD_TARGET"

          xcodebuild clean archive \
            $BUILD_TARGET \
            -scheme NativePHP \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NativePHP.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""

      - name: Create .ipa Package
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/NativePHP.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r -q "GuruCrackers-iOS.ipa" Payload/
          ls -lh GuruCrackers-iOS.ipa

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuruCrackers-iOS
          path: ${{ runner.temp }}/GuruCrackers-iOS.ipa
          retention-days: 30
